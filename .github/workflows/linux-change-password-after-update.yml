name: linux-change-password-after-update

on:
  push:
    branches: [studio-regression-ci]
    paths:
      - install.sh
      - studio/**
      - unsloth_cli/**
      - .github/workflows/linux-change-password-after-update.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trap-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Studio at current tip
        run: bash install.sh --local

      - name: Launch Studio in background
        run: |
          PORT=8889
          LOG="$HOME/.unsloth/studio/share/studio.log"
          mkdir -p "$(dirname "$LOG")"
          : > "$LOG"
          nohup "$HOME/.local/bin/unsloth" studio -H 127.0.0.1 -p $PORT >>"$LOG" 2>&1 &
          for i in $(seq 1 180); do
            curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PORT/api/health"

      - name: Bootstrap password via API
        id: bootstrap
        run: |
          PORT=8889
          BOOTSTRAP_FILE="$HOME/.unsloth/studio/share/.bootstrap_password"
          if [[ ! -f "$BOOTSTRAP_FILE" ]]; then
            echo "FAIL: bootstrap password file not found at $BOOTSTRAP_FILE"
            ls -la "$HOME/.unsloth/studio/share/" || true
            exit 1
          fi
          BOOT_PW=$(cat "$BOOTSTRAP_FILE")
          echo "[bootstrap] using bootstrap password from $BOOTSTRAP_FILE"
          curl -fsS -X POST "http://127.0.0.1:$PORT/api/auth/change-password" \
            -H "Content-Type: application/json" \
            -d "{\"current_password\":\"$BOOT_PW\",\"new_password\":\"TestPassw0rd!\"}"
          echo "[bootstrap] password set to TestPassw0rd!"

      - name: Verify requires_password_change=false before update
        run: |
          PORT=8889
          STATUS=$(curl -fsS "http://127.0.0.1:$PORT/api/auth/status")
          echo "[before-update auth/status] $STATUS"
          if echo "$STATUS" | grep -q '"requires_password_change": *true'; then
            echo "FAIL: server still wants password change AFTER bootstrap"
            exit 1
          fi
          echo "PASS: server reports requires_password_change=false"

      - name: Stop Studio
        run: |
          pkill -f "unsloth studio" || true
          pkill -f "uvicorn" || true
          sleep 3

      - name: Run update (simulates user upgrading to new release)
        run: |
          "$HOME/.local/bin/unsloth" studio update --local

      - name: Relaunch Studio
        run: |
          PORT=8889
          LOG="$HOME/.unsloth/studio/share/studio.log"
          : > "$LOG"
          nohup "$HOME/.local/bin/unsloth" studio -H 127.0.0.1 -p $PORT >>"$LOG" 2>&1 &
          for i in $(seq 1 180); do
            curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PORT/api/health"

      - name: Verify requires_password_change=false after update
        run: |
          PORT=8889
          STATUS=$(curl -fsS "http://127.0.0.1:$PORT/api/auth/status")
          echo "[after-update auth/status] $STATUS"
          if echo "$STATUS" | grep -q '"requires_password_change": *true'; then
            echo "FAIL: server flipped to requires_password_change=true after update"
            echo "This is the change-password trap the user reported."
            exit 1
          fi
          echo "PASS: server STILL reports requires_password_change=false after update"

      - name: "Playwright: poison localStorage + reload + screenshot"
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          mkdir -p "$RUNNER_TEMP/shots"
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              context = browser.new_context()
              # Set the stale flag the frontend used to never clear
              context.add_init_script("""
                window.localStorage.setItem('unsloth_auth_must_change_password', 'true');
              """)
              page = context.new_page()
              page.goto("http://127.0.0.1:8889/", wait_until="networkidle", timeout=30000)
              page.screenshot(path="/tmp/after_update_stale_flag.png", full_page=True)
              # The page should NOT be the 3-field change-password form because
              # /api/auth/status reports requires_password_change=false and the
              # PR 5576 fix reconciles the stale localStorage flag.
              text = page.inner_text("body").lower()
              print(f"[playwright] body text excerpt: {text[:500]!r}", flush=True)
              if "current password" in text and "new password" in text and "repeat" in text:
                  print("FAIL: stuck on 3-field change-password page after update")
                  raise SystemExit(1)
              print("PASS: change-password trap NOT triggered after update")
              browser.close()
          PY
          cp /tmp/after_update_stale_flag.png "$RUNNER_TEMP/shots/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-change-password-after-update-${{ github.run_id }}
          path: |
            ~/.unsloth/studio/share/studio.log
            ${{ runner.temp }}/shots
          if-no-files-found: ignore
