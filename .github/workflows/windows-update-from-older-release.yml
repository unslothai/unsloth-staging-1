name: windows-update-from-older-release

on:
  push:
    branches: [studio-regression-ci]
    paths:
      - install.ps1
      - studio/setup.ps1
      - studio/install_python_stack.py
      - unsloth_cli/**
      - .github/workflows/windows-update-from-older-release.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout current tip
        uses: actions/checkout@v4
        with:
          path: current
      - name: Clone unsloth pip branch + checkout 3 releases back
        run: |
          git clone --depth 200 -b pip https://github.com/unslothai/unsloth older
          cd older
          git checkout v0.1.38-beta
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Defender exclusions
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.unsloth" -ErrorAction SilentlyContinue
        continue-on-error: true

      - name: Install Studio at v0.1.38-beta
        run: |
          cd older
          ./install.ps1 --local

      - name: Capture pre-update state
        id: before
        run: |
          $Launcher = Join-Path $env:LOCALAPPDATA 'Unsloth Studio\launch-studio.ps1'
          $VenvPy = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $Launcher)) { Write-Host "FAIL: launcher missing"; exit 1 }
          $Index = & $VenvPy -c "import pathlib, studio; print(pathlib.Path(studio.__file__).parent / 'frontend' / 'dist' / 'index.html')"
          $StudioPkg = & $VenvPy -c "import pathlib, studio; print(pathlib.Path(studio.__file__).parent)"
          $LH = (Get-FileHash -LiteralPath $Launcher -Algorithm SHA256).Hash
          $IH = if (Test-Path -LiteralPath $Index) {
            (Get-FileHash -LiteralPath $Index -Algorithm SHA256).Hash
          } else { "missing" }
          $Ver = & $VenvPy -c "import importlib.metadata as m; print(m.version('unsloth'))" 2>$null
          "launcher_hash=$LH" | Out-File -Append $env:GITHUB_OUTPUT
          "index_hash=$IH"    | Out-File -Append $env:GITHUB_OUTPUT
          "version=$Ver"      | Out-File -Append $env:GITHUB_OUTPUT
          "studio_pkg=$StudioPkg" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "[before] launcher=$LH index=$IH version=$Ver pkg=$StudioPkg"

      - name: Overlay current tip into venv (simulate post-PR-merge upgrade)
        run: |
          $VenvPy = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\python.exe'
          & $VenvPy -m pip install --no-deps --force-reinstall -e current
          # Pre-install uv in the venv so setup.ps1 skips the astral.sh fetch,
          # which fails inside the python -> powershell nested process with
          # "Microsoft.PowerShell.Security could not be loaded".
          & $VenvPy -m pip install uv

      - name: Run unsloth studio update via venv python
        run: |
          # Avoid the unsloth.exe lock that pip cannot replace while running.
          $VenvPy = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\python.exe'
          cd current
          & $VenvPy -c "from unsloth_cli import app; app(['studio', 'update', '--local'])"

      - name: Capture post-update state
        id: after
        run: |
          $Launcher = Join-Path $env:LOCALAPPDATA 'Unsloth Studio\launch-studio.ps1'
          $VenvPy = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $Launcher)) { Write-Host "FAIL: launcher gone after update"; exit 1 }
          $Index = & $VenvPy -c "import pathlib, studio; print(pathlib.Path(studio.__file__).parent / 'frontend' / 'dist' / 'index.html')"
          $StudioPkg = & $VenvPy -c "import pathlib, studio; print(pathlib.Path(studio.__file__).parent)"
          $LH = (Get-FileHash -LiteralPath $Launcher -Algorithm SHA256).Hash
          $IH = if (Test-Path -LiteralPath $Index) {
            (Get-FileHash -LiteralPath $Index -Algorithm SHA256).Hash
          } else { "missing" }
          $Ver = & $VenvPy -c "import importlib.metadata as m; print(m.version('unsloth'))" 2>$null
          "launcher_hash=$LH" | Out-File -Append $env:GITHUB_OUTPUT
          "index_hash=$IH"    | Out-File -Append $env:GITHUB_OUTPUT
          "version=$Ver"      | Out-File -Append $env:GITHUB_OUTPUT
          "studio_pkg=$StudioPkg" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "[after] launcher=$LH index=$IH version=$Ver pkg=$StudioPkg"

      - name: Assert launcher refreshed
        run: |
          $bl = "${{ steps.before.outputs.launcher_hash }}"
          $al = "${{ steps.after.outputs.launcher_hash }}"
          if ($bl -eq $al) {
            Write-Host "FAIL: launcher unchanged after update ($bl)"
            exit 1
          }
          Write-Host "PASS: launcher rewrote ($bl -> $al)"

      - name: Assert frontend bundle refreshed
        run: |
          $bi = "${{ steps.before.outputs.index_hash }}"
          $ai = "${{ steps.after.outputs.index_hash }}"
          if ($bi -eq $ai) {
            Write-Host "FAIL: frontend index.html unchanged after update ($bi)"
            exit 1
          }
          Write-Host "PASS: frontend rewrote ($bi -> $ai)"

      - name: Launch Studio in background (PowerShell job) + health-check
        run: |
          $Port = 8889
          $StudioHome = Join-Path $env:USERPROFILE '.unsloth\studio'
          $Log = Join-Path $StudioHome 'share\studio.log'
          New-Item -ItemType Directory -Force -Path (Split-Path $Log) | Out-Null
          Set-Content -LiteralPath $Log -Value ""
          $UnslothExe = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\unsloth.exe'
          if (-not (Test-Path -LiteralPath $UnslothExe)) {
            Write-Host "FAIL: unsloth.exe missing after update"; exit 1
          }
          # PowerShell job survives the step boundary and inherits no console;
          # write to a separate file we can tail for diagnosis.
          $JobLog = $Log + '.job'
          $job = Start-Job -ScriptBlock {
            param($exe, $port, $log)
            & $exe studio -H 127.0.0.1 -p $port *> $log
          } -ArgumentList @($UnslothExe, $Port, $JobLog)
          Write-Host "[launch] Studio job id=$($job.Id) state=$($job.State)"

          for ($i = 0; $i -lt 240; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$Port/api/health" -TimeoutSec 2 -ErrorAction Stop
              if ($r.StatusCode -eq 200) { break }
            } catch { Start-Sleep -Seconds 1 }
          }
          $health = try { Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$Port/api/health" -TimeoutSec 2 -ErrorAction Stop } catch { $null }
          if (-not $health) {
            Write-Host "FAIL: Studio did not come up at port $Port within 240s; job state=$($job.State), tail of $JobLog :"
            Get-Content -LiteralPath $JobLog -Tail 60 -ErrorAction SilentlyContinue
            Write-Host "--- live Receive-Job ---"
            Receive-Job -Job $job -Keep 2>&1 | Select-Object -Last 40
            exit 1
          }
          Write-Host "[health] $($health.Content)"

          $Status = (Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$Port/api/auth/status").Content
          Write-Host "[auth/status] $Status"
          # Fresh install legitimately reports requires_password_change=true until
          # the user finishes the bootstrap flow. Informational only.

          $Shots = Join-Path $env:RUNNER_TEMP "screenshots"
          New-Item -ItemType Directory -Force -Path $Shots | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$Port/" -OutFile (Join-Path $Shots "index.html")
          Write-Host "[screenshot] installing playwright"
          & $VenvPy -m pip install --quiet playwright
          & $VenvPy -m playwright install chromium | Out-Null
          $PyScript = @"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              for route in ('/', '/chat', '/train'):
                  page = browser.new_page()
                  page.goto(f'http://127.0.0.1:$Port{route}', wait_until='networkidle', timeout=30000)
                  name = route.strip('/').replace('/', '_') or 'root'
                  page.screenshot(path=rf'$Shots\\shot_{name}.png', full_page=True)
                  print(f'shot {route} -> shot_{name}.png', flush=True)
                  page.close()
              browser.close()
          "@
          $PyScript | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'shot.py')
          & $VenvPy (Join-Path $env:RUNNER_TEMP 'shot.py')
          Get-ChildItem $Shots

          Write-Host "[idle] sleeping 90s to surface any /api/inference/load spam"
          Start-Sleep -Seconds 90
          $Spam = (Get-Content -LiteralPath $Log -ErrorAction SilentlyContinue | Select-String -Pattern '"path": "/api/inference/load"').Count
          Write-Host "[idle] /api/inference/load POST count = $Spam"
          if ($Spam -gt 3) {
            Write-Host "FAIL: load-spam regression (>3 /api/inference/load posts in 90s idle)"
            Get-Content -LiteralPath $Log -Tail 40
            exit 1
          }
          Write-Host "PASS: no load-spam after update"

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-from-older-release-${{ github.run_id }}
          path: |
            ${{ env.USERPROFILE }}/.unsloth/studio/share/studio.log
            ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
