name: windows-uninstall-reinstall

on:
  push:
    branches: [studio-regression-ci]
    paths:
      - install.ps1
      - studio/setup.ps1
      - studio/install_python_stack.py
      - unsloth_cli/**
      - .github/workflows/windows-uninstall-reinstall.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Defender exclusions
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.unsloth" -ErrorAction SilentlyContinue
        continue-on-error: true

      - name: Install
        run: |
          ./install.ps1 --local

      - name: Uninstall
        run: |
          # Best-effort tear-down: drop the venv + launchers + shortcuts.
          $StudioHome = Join-Path $env:USERPROFILE '.unsloth\studio'
          $LauncherDir = Join-Path $env:LOCALAPPDATA 'Unsloth Studio'
          $Desktop = [Environment]::GetFolderPath('Desktop')
          $StartMenu = [Environment]::GetFolderPath('Programs')
          if (Test-Path -LiteralPath $StudioHome) { Remove-Item -LiteralPath $StudioHome -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path -LiteralPath $LauncherDir) { Remove-Item -LiteralPath $LauncherDir -Recurse -Force -ErrorAction SilentlyContinue }
          Get-ChildItem -LiteralPath $Desktop -Filter "Unsloth Studio*.lnk" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $StartMenu -Recurse -Filter "Unsloth Studio*.lnk" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Reinstall
        run: |
          ./install.ps1 --local

      - name: Health-check after reinstall
        run: |
          $Port = 8889
          $StudioHome = Join-Path $env:USERPROFILE '.unsloth\studio'
          $Log = Join-Path $StudioHome 'share\studio.log'
          New-Item -ItemType Directory -Force -Path (Split-Path $Log) | Out-Null
          Set-Content -LiteralPath $Log -Value ""
          $UnslothExe = Join-Path $StudioHome 'unsloth_studio\Scripts\unsloth.exe'
          if (-not (Test-Path -LiteralPath $UnslothExe)) { Write-Host "FAIL: unsloth.exe missing"; exit 1 }
          Start-Process -FilePath cmd.exe `
            -ArgumentList @('/c', "`"$UnslothExe`" studio -H 127.0.0.1 -p $Port > `"$Log`" 2>&1") `
            -WindowStyle Hidden
          for ($i = 0; $i -lt 240; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$Port/api/health" -TimeoutSec 2 -ErrorAction Stop
              if ($r.StatusCode -eq 200) { break }
            } catch { Start-Sleep -Seconds 1 }
          }
          $health = try { Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$Port/api/health" -TimeoutSec 2 -ErrorAction Stop } catch { $null }
          if (-not $health) {
            Write-Host "FAIL: Studio did not come up after reinstall"
            Get-Content -LiteralPath $Log -Tail 40 -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "[health] $($health.Content)"
