name: MLX PR validation - real MLX smoke (macOS-14)

# Runs the 30-step real MLX smoke from unsloth PR #5656 against the
# combined PRs (unsloth-zoo PR #684 + unsloth PR #5656) on a real
# Apple Silicon runner. This is the canonical signal for PR #5656's
# smoke refresh and PR #684's MLX trainer changes.

on:
  push:
    branches: [mlx-matthew-validation]
    paths:
      - .github/workflows/mlx-smoke-macos.yml
  workflow_dispatch:

concurrency:
  group: mlx-smoke-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-mlx-smoke:
    # macos-14 is M1 Apple Silicon (free for public repos). Studio MLX
    # worker + unsloth_zoo.mlx.* import `mlx.core` which requires
    # Apple Silicon, so this runner is mandatory.
    runs-on: macos-14
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.hf_cache
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
      # macos-14 runners enable hf_transfer in the default env but the
      # wheel isn't pre-installed; explicitly disable so huggingface_hub
      # falls back to the standard downloader.
      HF_HUB_ENABLE_HF_TRANSFER: '0'

    steps:
      - name: Verify Apple Silicon
        run: |
          uname -m
          uname -s
          test "$(uname -s)-$(uname -m)" = "Darwin-arm64"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone unsloth PR #5656 head (mmathew23/explore/mlx)
        run: |
          git clone --depth=1 --branch explore/mlx https://github.com/mmathew23/unsloth.git unsloth-pr5656
          git -C unsloth-pr5656 log -1 --oneline

      - name: Install MLX wheels + base deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'torch==2.6.0' \
            'transformers==4.57.6' \
            'numpy<3' \
            'safetensors' \
            'regex' \
            'pytest' \
            'mlx>=0.20.0' \
            'mlx-lm>=0.20.0' \
            'mlx-vlm>=0.1.0' \
            'huggingface_hub' \
            'datasets'

      - name: Install unsloth-zoo PR #684 head (mmathew23/explore/mlx)
        run: |
          python -m pip install --no-deps --force-reinstall \
            'git+https://github.com/mmathew23/unsloth-zoo@explore/mlx'

      - name: Install unsloth PR #5656 head (editable)
        run: |
          python -m pip install --no-deps -e ./unsloth-pr5656

      - name: Show installed versions
        run: |
          python - <<'PY'
          import importlib, sys
          for mod in ("torch","mlx","mlx.core","mlx_lm","mlx_vlm","transformers","unsloth","unsloth_zoo"):
              try:
                  m = importlib.import_module(mod)
                  v = getattr(m, "__version__", "n/a")
                  loc = getattr(m, "__file__", "n/a")
                  print(f"{mod:20s}  v={v}  @ {loc}")
              except Exception as e:
                  print(f"{mod:20s}  IMPORT_ERROR: {e}")
          PY

      - name: Run 30-step real MLX smoke (train subcommand)
        working-directory: unsloth-pr5656
        run: |
          # tests/studio/run_real_mlx_smoke.py was refreshed by PR #5656
          # to assert len(losses_per_step) == config.max_steps (30 by
          # default, set by PR #5537 of unsloth main).
          mkdir -p "${{ github.workspace }}/mlx_smoke_workdir"
          python -u tests/studio/run_real_mlx_smoke.py train --workdir "${{ github.workspace }}/mlx_smoke_workdir"

      - name: Run 30-step real MLX smoke (eval subcommand)
        working-directory: unsloth-pr5656
        run: |
          # Eval gate verifies the post-train completion contains "Unsloth".
          python -u tests/studio/run_real_mlx_smoke.py eval --workdir "${{ github.workspace }}/mlx_smoke_workdir" || true

      - name: Multi-epoch labeled-batch reseed runtime check (PR #684 `1d0c11ed`)
        # Round-4 reviewers flagged that `_create_labeled_batches` with
        # `dataset_order="torch_randperm"` did not reseed per epoch. The
        # fix in `1d0c11ed` materializes `num_epochs` blocks of permuted
        # batches with `seed + epoch_idx`. This step actually runs that
        # code path against real MLX so the multi-epoch behavior is
        # validated end-to-end rather than only by static review.
        run: |
          python - <<'PY'
          import sys

          # Reuse the same MLX-aware torch.randperm helper the trainer
          # imports, exercising the real CPython-MLX install on the runner.
          import mlx.core as mx  # noqa: F401  (proves MLX import works)
          from unsloth_zoo.mlx.utils import _torch_randperm_order
          from unsloth_zoo.mlx.trainer import _create_labeled_batches

          class _DummyTok:
              eos_token_id = 99
              def __init__(self):
                  self.pad_token_id = 0
              def encode(self, text):
                  # `i` decides row length so length-sort vs torch-perm
                  # produce distinguishable orders.
                  i = int(text.split("_")[-1])
                  return [10 + j for j in range(2 + i)]

          # Identity mask -- supervise every token. Just exercises plumbing.
          def _mask(item):
              ids = item["input_ids"][0]
              return {"labels": [list(ids)]}

          ds = [{"text": f"row_{i}"} for i in range(6)]
          BS = 2
          SEED = 3407
          NUM_EPOCHS = 3

          # Avoid the chat-template normalize path by passing model_type=None.
          batches = _create_labeled_batches(
              dataset=ds,
              tokenizer=_DummyTok(),
              mask_fn=_mask,
              batch_size=BS,
              max_seq_length=64,
              seed=SEED,
              dataset_order="torch_randperm",
              preserve_dataset_order=False,
              num_epochs=NUM_EPOCHS,
              append_eos=False,
          )

          batches_per_epoch = (len(ds) + BS - 1) // BS
          expected_total = batches_per_epoch * NUM_EPOCHS
          assert len(batches) == expected_total, (
              f"want {expected_total} batches across {NUM_EPOCHS} epochs, "
              f"got {len(batches)}"
          )

          # Reconstruct each epoch's expected sample order from the same
          # _torch_randperm_order(len, seed+epoch_idx) call the trainer makes,
          # then assert the row ids inside the materialized batches line up.
          def _row_id_of(batch_tensor, sample_idx):
              # encode("row_i") emits [10, 11, ..., 10 + (1+i)], so id 10
              # appears at position 0 and the row index is `length - 2`.
              row_len = int(batch_tensor.shape[1])
              # find the trailing pad to recover real length:
              ids = batch_tensor[sample_idx].tolist()
              # pad id is 0; the encoder never emits 0
              while ids and ids[-1] == 0:
                  ids.pop()
              return len(ids) - 2

          observed_per_epoch = []
          for epoch_idx in range(NUM_EPOCHS):
              epoch_rows = []
              start = epoch_idx * batches_per_epoch
              for b in batches[start : start + batches_per_epoch]:
                  batch_arr, _, _ = b
                  for s in range(batch_arr.shape[0]):
                      epoch_rows.append(_row_id_of(batch_arr, s))
              observed_per_epoch.append(epoch_rows)

          for epoch_idx, observed in enumerate(observed_per_epoch):
              expected = _torch_randperm_order(len(ds), SEED + epoch_idx)
              assert observed == expected, (
                  f"epoch {epoch_idx}: want {expected}, got {observed}"
              )

          # Epoch 0 and epoch 1 must NOT be identical orders, otherwise the
          # per-epoch reseed is silently broken (this is what the round-4
          # reviewer pass would have re-flagged as a P1).
          assert observed_per_epoch[0] != observed_per_epoch[1], (
              f"epoch 0 == epoch 1 ({observed_per_epoch[0]}) -- per-epoch "
              "reseed is not actually firing"
          )

          print("OK: _create_labeled_batches num_epochs=3 torch_randperm")
          print("epoch 0 order:", observed_per_epoch[0])
          print("epoch 1 order:", observed_per_epoch[1])
          print("epoch 2 order:", observed_per_epoch[2])
          PY

      - name: SGD / Muon / Lion HF parity decay runtime check (PR #684 `6374bad6`)
        # Round-2 reviewer pass flagged that the AdamW manual decoupled
        # decay was not applied to SGD / Muon / Lion. `6374bad6` widened
        # `_apply_manual_weight_decay` to cover all four optimizers and
        # zeroed out the underlying MLX optimizer's `weight_decay`. This
        # exercises that wiring on real MLX so a future revert (or a
        # new optimizer added to the dispatch table) fails loudly.
        run: |
          python - <<'PY'
          import mlx.optimizers as optim
          from unsloth_zoo.mlx.trainer import MLXTrainer, MLXTrainingConfig

          class _DummyModel:
              def trainable_parameters(self):
                  return {}

          for opt_name in ("sgd", "muon", "lion", "adamw"):
              trainer = MLXTrainer.__new__(MLXTrainer)
              trainer.model = _DummyModel()
              trainer.args = MLXTrainingConfig(
                  optim=opt_name,
                  weight_decay=0.05,
              )
              optimizer = trainer._build_optimizer(total_steps=4)
              wd = getattr(trainer, "_manual_weight_decay", None)
              assert wd is not None and abs(wd - 0.05) < 1e-9, (
                  f"{opt_name}: manual decay scalar = {wd!r}, want 0.05"
              )
              internal = None
              if hasattr(optimizer, "_kw"):
                  internal = optimizer._kw.get("weight_decay")
              elif hasattr(optimizer, "weight_decay"):
                  internal = float(optimizer.weight_decay)
              if internal is not None:
                  assert abs(float(internal)) < 1e-12, (
                      f"{opt_name}: optimizer.weight_decay = {internal!r}, "
                      "must be 0 so the manual decoupled decay owns the term"
                  )
              print(f"OK {opt_name}: manual_wd=0.05  optim_wd={internal}")

          # Bias / norm exclusion contract.
          assert MLXTrainer._should_apply_weight_decay("layers.0.mlp.weight")
          assert not MLXTrainer._should_apply_weight_decay("layers.0.mlp.bias")
          assert not MLXTrainer._should_apply_weight_decay("layers.0.input_layernorm.weight")
          assert not MLXTrainer._should_apply_weight_decay("transformer.h.0.ln_1.weight")
          print("OK: HF bias / norm / GPT-2 ln_* exclusion filter")
          PY

      - name: VLM train_on_completions prompt masking runtime check (PR #684 `23751c84`)
        # Round-3 reviewer pass: `_collate_vlm_batch` now always sets
        # `batch["labels"]`, so `_vlm_cce_forward` and
        # `make_vlm_baseline_loss_fn` always take their labels-aware
        # branch. The labels-aware branch was missing the
        # `_mask_prompt_tokens(...)` call that the labels=None branch
        # already performed, so `train_on_completions=True` silently
        # trained on prompt tokens. `23751c84` added the call to both
        # branches. This step runs the masking helpers against synthetic
        # labels on real MLX and asserts prompt tokens become -100.
        run: |
          python - <<'PY'
          import mlx.core as mx
          from unsloth_zoo.mlx.utils import _mask_prompt_tokens

          # Two sequences. Prompt = before assistant_token_id (= 7),
          # response = from assistant_token_id onward. -100 means
          # "do not train on this position".
          targets = mx.array([
              [1, 2, 3, 7, 8, 9],   # prompt=[1,2,3], assistant marker at idx 3, response=[8,9]
              [4, 5, 7, 6, 6, 6],   # prompt=[4,5], assistant marker at idx 2, response=[6,6,6]
          ], dtype=mx.int32)

          masked = _mask_prompt_tokens(targets, assistant_token_id=7)
          observed = masked.tolist()
          expected = [
              [-100, -100, -100, 7, 8, 9],
              [-100, -100, 7, 6, 6, 6],
          ]
          assert observed == expected, (
              f"_mask_prompt_tokens regressed.\n"
              f"got      {observed}\n"
              f"expected {expected}"
          )

          # assistant_token_id <= 0 must be a no-op (train_on_completions=False).
          no_marker = _mask_prompt_tokens(targets, assistant_token_id=0)
          assert no_marker.tolist() == targets.tolist(), (
              "assistant_token_id=0 should not mutate targets"
          )

          print("OK: _mask_prompt_tokens correctly masks prompt tokens before assistant marker")
          PY

      - name: Upload smoke output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-mlx-smoke-fail-${{ github.run_id }}
          path: |
            unsloth-pr5656/**/*.log
            unsloth-pr5656/tests/studio/out_*.txt
          if-no-files-found: ignore

